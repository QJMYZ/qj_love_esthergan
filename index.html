<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Gallery</title>
<meta name="theme-color" content="#63bfb6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#63bfb6;--ink:#1d3a5a;--muted:#0f3350;--paper:#fffdf9;--shadow:rgba(29,58,90,.28);--accent:#d6457a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,serif;min-height:100vh}
.mascot{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 18px var(--shadow);display:block;margin:0 auto 14px;transform:rotate(-4deg)}
header{text-align:center;padding:48px 20px 20px}
h1{font-family:"Fredoka","Fraunces",sans-serif;font-weight:600;font-size:clamp(2rem,7vw,3.6rem);margin:0;outline:none;letter-spacing:-.01em}
.sub{font-family:"Caveat",cursive;font-size:1.5rem;color:var(--muted);margin:6px 0 0;outline:none}
.bar{display:flex;gap:10px;justify-content:center;padding:14px 20px 4px;flex-wrap:wrap}
.status{text-align:center;color:var(--muted);font-size:.85rem;min-height:1.2em;margin:6px 20px 0}
button{font:inherit;font-size:.95rem;border:1.5px solid var(--accent);background:var(--accent);color:#fff;padding:10px 18px;border-radius:999px;cursor:pointer}
button.ghost{background:rgba(255,255,255,.6);color:var(--ink);border-color:rgba(255,255,255,.9)}
button.warn{background:#c0392b;border-color:#c0392b;color:#fff}
button:focus-visible,[contenteditable]:focus-visible,.frame:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
header,.bar,.status,.wall{position:relative;z-index:1}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 26px;max-width:1100px;margin:0 auto;padding:30px 24px 120px}
.pol{background:var(--paper);padding:12px 12px 8px;border-radius:3px;box-shadow:0 10px 24px var(--shadow);position:relative;border-radius:16px;transition:transform .2s;margin:0}
.pol:nth-child(3n+1){transform:rotate(-2.4deg)}.pol:nth-child(3n+2){transform:rotate(1.8deg) translateY(10px)}.pol:nth-child(3n){transform:rotate(-.8deg)}
.pol:hover{transform:rotate(0) scale(1.03);z-index:2}
.frame{aspect-ratio:1;width:100%;background:#dcecf6;display:grid;place-items:center;overflow:hidden;cursor:pointer;border:0;padding:0;border-radius:10px;color:#46688a}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-family:"Caveat",cursive;font-size:1.45rem;color:#1d3a5a;text-align:center;min-height:2.4rem;padding:6px 2px;outline:none;line-height:1.2}
.cap:empty::before{content:attr(data-ph);color:#8aa3b8}
.x{position:absolute;top:-12px;right:-10px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:#1d3a5a;border-color:#1d3a5a;font-size:.9rem;line-height:1;opacity:0}
.pol:hover .x,.x:focus-visible,.x.warn{opacity:1}
@media (hover:none){.x{opacity:1}}
dialog{border:0;background:transparent;padding:0;max-width:94vw;max-height:92vh}
dialog::backdrop{background:rgba(10,6,24,.82)}
dialog img{max-width:94vw;max-height:88vh;display:block;border:10px solid var(--paper);border-radius:3px}
.sea{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bub{position:absolute;bottom:-70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,255,255,.12));border:1.5px solid rgba(255,255,255,.7);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh)}}
.sea svg{position:absolute;left:0;bottom:0;width:100%;height:90px}
@media (prefers-reduced-motion:reduce){.pol{transition:none}.bub{animation:none;bottom:auto}.b1{top:20%}.b2{top:55%}.b3{top:35%}.b4{top:75%}.b5{top:12%}.b6{top:65%}}
</style>
</head>

<h1 id="title" contenteditable="true" spellcheck="false" aria-label="Title">Our Gallery</h1>
<p class="sub" id="sub" contenteditable="true" spellcheck="false" aria-label="Subtitle">for my cute baby</p>
</header>
<div class="bar">
<button id="add">Add photos</button>
<button id="more" class="ghost">Add empty frame</button>
</div>
<p class="status" id="status" role="status"></p>
<input id="file" type="file" accept="image/*" multiple hidden>
<main class="wall" id="wall"></main>
<dialog id="lb"><img alt="" id="big"></dialog>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,getDoc,setDoc,addDoc,updateDoc,deleteDoc,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== STEP 1: // For Firebase JS SDK v7.20.0 and later, measurementId is optional


var DATABASE_ID='(default)'; /* must match the Database ID you create in Firebase; use '(default)' if yours is the default */
var firebaseConfig={
  apiKey:"AIzaSyD2QGj-USEpwz_i7RwEQ3lpb8k0S05VN0M",
  authDomain:"project-a8fbe.firebaseapp.com",
  projectId:"project-a8fbe",
  storageBucket:"project-a8fbe.firebasestorage.app",
  messagingSenderId:"299669271606",
  appId:"1:299669271606:web:a6a39f8a061295e3fa1497"
  measurementId: "G-YW57TDFMWB"
};
/* ============================================================== */

var wall=document.getElementById('wall'),file=document.getElementById('file'),lb=document.getElementById('lb'),big=document.getElementById('big'),statusEl=document.getElementById('status');
var titleEl=document.getElementById('title'),subEl=document.getElementById('sub');
var initErr=null,items=[],els={},target=null,metaT=null,n=0,ops,store=null;
function say(t){statusEl.textContent=t}

var configured=firebaseConfig.apiKey.indexOf('PASTE')!==0;
if(configured){
  try{
    var app=initializeApp(firebaseConfig);
    var fs;
    try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})},DATABASE_ID)}
    catch(e){fs=initializeFirestore(app,{},DATABASE_ID)}
    store={fs:fs,photos:collection(fs,'photos'),meta:doc(fs,'collage','meta')};
  }catch(e){store=null;initErr=e}
}

function shrink(fl,max,q){return new Promise(function(res,rej){
  var url=URL.createObjectURL(fl),im=new Image();
  im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);var d=c.toDataURL('image/jpeg',q);
    if(d.length>800000&&max>600)shrink(fl,600,.6).then(res,rej);else res(d)};
  im.onerror=function(){URL.revokeObjectURL(url);rej()};im.src=url})}

function setFrame(p,src){
  var f=p._f;f.innerHTML='';p._src=src;
  if(src){var im=document.createElement('img');im.src=src;im.alt='Photo';f.appendChild(im);f.setAttribute('aria-label','View photo larger')}
  else{f.textContent='+ add photo';f.setAttribute('aria-label','Add a photo')}
}
function build(it){
  var p=document.createElement('figure');p.className='pol';p._id=it.id;
  var f=document.createElement('button');f.className='frame';f.type='button';p._f=f;
  var c=document.createElement('figcaption');c.className='cap';c.contentEditable='true';c.spellcheck=false;c.dataset.ph='write a memory';p._c=c;
  var x=document.createElement('button');x.className='x';x.type='button';x.textContent='\u00d7';x.setAttribute('aria-label','Delete this photo');
  f.addEventListener('click',function(){
    if(p._src){big.src=p._src;lb.showModal()}else{target=p._id;file.removeAttribute('multiple');file.click()}});
  var t=null;
  c.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){ops.cap(p._id,c.textContent)},600)});
  x.addEventListener('click',function(){
    if(x.classList.contains('warn')){ops.remove(p._id);return}
    x.classList.add('warn');x.textContent='Delete?';
    setTimeout(function(){x.classList.remove('warn');x.textContent='\u00d7'},3000)});
  p.append(f,c,x);setFrame(p,undefined);return p;
}
function render(){
  var ids=items.map(function(i){return i.id});
  Object.keys(els).forEach(function(id){if(ids.indexOf(id)<0){els[id].remove();delete els[id]}});
  items.forEach(function(it,idx){
    var p=els[it.id];if(!p){p=build(it);els[it.id]=p}
    if(p._src!==(it.src||null))setFrame(p,it.src||null);
    if(document.activeElement!==p._c&&p._c.textContent!==(it.cap||''))p._c.textContent=it.cap||'';
    if(wall.children[idx]!==p)wall.insertBefore(p,wall.children[idx]||null);
  });
}

if(store){
  ops={
    add:function(src,cap,o){return addDoc(store.photos,{src:src||null,cap:cap||'',order:o||Date.now()})},
    src:function(id,src){return updateDoc(doc(store.fs,'photos',id),{src:src})},
    cap:function(id,cap){return updateDoc(doc(store.fs,'photos',id),{cap:cap})},
    remove:function(id){return deleteDoc(doc(store.fs,'photos',id))},
    meta:function(){clearTimeout(metaT);metaT=setTimeout(function(){setDoc(store.meta,{title:titleEl.textContent,sub:subEl.textContent},{merge:true})},600)}
  };
  var err=function(e){say('Firebase error ('+((e&&e.code)||e)+'). Check your config, database ID and Firestore rules.')};
  getDoc(store.meta).then(function(s){
    if(!s.exists()){setDoc(store.meta,{title:titleEl.textContent,sub:subEl.textContent});for(var i=0;i<6;i++)ops.add(null,'',Date.now()+i)}
  }).catch(err);
  onSnapshot(query(store.photos,orderBy('order')),{includeMetadataChanges:true},function(s){
    items=s.docs.map(function(d){var v=d.data();return {id:d.id,src:v.src,cap:v.cap}});
    render();say(s.metadata.hasPendingWrites?'Saving\u2026':(s.metadata.fromCache?'Offline: will sync when connected':'Saved and synced'));
  },err);
  onSnapshot(store.meta,function(s){
    var v=s.data();if(!v)return;
    var fix={};
    if(v.title==='Our favorite moments'){v.title='Our Gallery';fix.title=v.title}
    if(v.sub==='for you, with love'){v.sub='for my cute baby';fix.sub=v.sub}
    if(fix.title||fix.sub)setDoc(store.meta,fix,{merge:true});
    if(document.activeElement!==titleEl&&v.title!=null)titleEl.textContent=v.title;
    if(document.activeElement!==subEl&&v.sub!=null)subEl.textContent=v.sub;
  },err);
}else{
  ops={
    add:function(src,cap,o){items.push({id:'l'+(n++),src:src||null,cap:cap||''});render()},
    src:function(id,src){items.forEach(function(i){if(i.id===id)i.src=src});render()},
    cap:function(id,cap){items.forEach(function(i){if(i.id===id)i.cap=cap})},
    remove:function(id){items=items.filter(function(i){return i.id!==id});render()},
    meta:function(){}
  };
  for(var i=0;i<6;i++)ops.add(null,'');
  say(initErr?('Firebase setup error: '+(initErr.message||initErr)):'Firebase is not set up yet, so nothing is saved. Paste your config into the file.');
}

function addFiles(files){addFiles2(files).catch(function(e){say('Could not save ('+((e&&e.code)||e)+')')})}
async function addFiles2(files){
  say('Adding photos\u2026');
  for(var i=0;i<files.length;i++){
    var src;try{src=await shrink(files[i],1000,.78)}catch(e){continue}
    if(src.length>1000000){say('One photo was too large to save. Try a smaller one.');continue}
    if(target){await ops.src(target,src);target=null;continue}
    var empty=items.find(function(o){return !o.src});
    if(empty)await ops.src(empty.id,src);else await ops.add(src,'');
  }
}
document.getElementById('add').addEventListener('click',function(){target=null;file.setAttribute('multiple','');file.click()});
document.getElementById('more').addEventListener('click',function(){ops.add(null,'')});
file.addEventListener('change',function(){var fl=Array.prototype.slice.call(file.files);file.value='';if(fl.length)addFiles(fl);else target=null});
lb.addEventListener('click',function(){lb.close()});
titleEl.addEventListener('input',ops.meta);subEl.addEventListener('input',ops.meta);
</script>
</body>
</html>
