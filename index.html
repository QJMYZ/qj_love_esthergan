<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Gallery</title>
<meta name="theme-color" content="#63bfb6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#63bfb6;--ink:#1d3a5a;--muted:#0f3350;--paper:#fffdf9;--shadow:rgba(29,58,90,.28);--accent:#ec6a8e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#a8e8e4 0%,#63bfb6 40%,#2f93ad 100%) fixed;color:var(--ink);font-family:"Fraunces",Georgia,serif;min-height:100vh}
.mascot{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 18px var(--shadow);display:block;margin:0 auto 14px;transform:rotate(-4deg);animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(2deg)}}
header{text-align:center;padding:48px 20px 20px}
h1{font-family:"Fredoka","Fraunces",sans-serif;font-weight:600;font-size:clamp(2rem,7vw,3.6rem);margin:0;outline:none;letter-spacing:-.01em;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 rgba(29,58,90,.35)}
.sub{font-family:"Caveat",cursive;font-size:1.5rem;color:var(--muted);margin:6px 0 0;outline:none}
.bar{display:flex;gap:10px;justify-content:center;padding:14px 20px 4px;flex-wrap:wrap}
.bar button{box-shadow:0 4px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.35)}
.bar button:active{transform:translateY(2px)}
.status{text-align:center;color:var(--muted);font-size:.85rem;min-height:1.2em;margin:6px 20px 0}
button{font:inherit;font-size:.95rem;border:1.5px solid var(--accent);background:var(--accent);color:#fff;padding:10px 18px;border-radius:999px;cursor:pointer}
button.ghost{background:rgba(255,255,255,.6);color:var(--ink);border-color:rgba(255,255,255,.9)}
button.warn{background:#c0392b;border-color:#c0392b;color:#fff}
button:focus-visible,[contenteditable]:focus-visible,.frame:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
header,.bar,.status,.wall{position:relative;z-index:1}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 26px;max-width:1100px;margin:0 auto;padding:30px 24px 40px}
.pol{background:var(--paper);padding:12px 12px 8px;border-radius:3px;box-shadow:0 10px 24px var(--shadow);position:relative;border-radius:16px;transition:transform .2s;margin:0}
.pol:nth-child(3n+1){transform:rotate(-2.4deg)}.pol:nth-child(3n+2){transform:rotate(1.8deg) translateY(10px)}.pol:nth-child(3n){transform:rotate(-.8deg)}
.pol:hover{transform:rotate(0) scale(1.03);z-index:2}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,196,214,.75);border-radius:3px;pointer-events:none;z-index:2}
.pol:nth-child(2n)::before{background:rgba(190,228,255,.75);transform:translateX(-50%) rotate(3deg)}
.frame{aspect-ratio:1;width:100%;background:#dcecf6;display:grid;place-items:center;overflow:hidden;cursor:pointer;border:0;padding:0;border-radius:10px;color:#46688a}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-family:"Caveat",cursive;font-size:1.45rem;color:#1d3a5a;text-align:center;min-height:2.4rem;padding:6px 2px;outline:none;line-height:1.2}
.cap:empty::before{content:attr(data-ph);color:#8aa3b8}
.x{position:absolute;top:-12px;right:-10px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:#1d3a5a;border-color:#1d3a5a;font-size:.9rem;line-height:1;opacity:0}
.pol:hover .x,.x:focus-visible,.x.warn{opacity:1}
@media (hover:none){.x{opacity:1}}
.grip{position:absolute;top:-12px;left:-10px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--accent);border-color:var(--accent);font-size:.9rem;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;z-index:3}
.grip:active{cursor:grabbing}
.pol.dragging{opacity:.35}
.pol.ghost{position:fixed;margin:0;pointer-events:none;z-index:100;opacity:.92;transform:rotate(3deg) scale(1.04)!important;box-shadow:0 18px 36px rgba(0,0,0,.35)}
.pol.drop-before{box-shadow:-8px 0 0 var(--accent),0 10px 24px var(--shadow)}
.pol.drop-after{box-shadow:8px 0 0 var(--accent),0 10px 24px var(--shadow)}
.end{position:relative;z-index:1;text-align:center;padding:0 20px 150px}
.end .wave{display:block;width:100%;max-width:1100px;height:34px;margin:0 auto 28px}
.porthole{width:min(260px,70vw);margin:0 auto;animation:bob2 5s ease-in-out infinite}
.porthole img{width:100%;height:auto;display:block;border-radius:22px}
.thanks{font-family:"Caveat",cursive;font-size:1.8rem;color:var(--ink);margin:20px 0 0}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
dialog{border:0;background:transparent;padding:0;max-width:94vw;max-height:92vh}
dialog video{display:none;max-width:94vw;max-height:88vh;border:10px solid var(--paper);border-radius:18px;background:#000}
.frame{position:relative}
.play{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:1.2rem;pointer-events:none}
dialog::backdrop{background:rgba(10,6,24,.82)}
dialog img{max-width:94vw;max-height:88vh;display:block;border:10px solid var(--paper);border-radius:18px;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 20px 50px rgba(0,0,0,.5)}
.sea{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bub{position:absolute;bottom:-70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,255,255,.12));border:1.5px solid rgba(255,255,255,.7);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh)}}
.sea .floor{position:absolute;left:0;bottom:0;width:100%;height:120px}
.fish{position:absolute;left:0;width:54px;fill:rgba(255,255,255,.55);animation:swim 45s linear infinite}
.f1{top:20%}.f2{top:44%;width:42px;animation-name:swimback;animation-duration:58s;animation-delay:-20s}.f3{top:66%;width:48px;animation-duration:52s;animation-delay:-30s}
@keyframes swim{from{transform:translateX(-90px) scaleX(-1)}to{transform:translateX(calc(100vw + 90px)) scaleX(-1)}}
@keyframes swimback{from{transform:translateX(calc(100vw + 90px))}to{transform:translateX(-90px)}}
@media (max-width:520px){.wall{grid-template-columns:repeat(2,1fr);gap:28px 14px;padding:26px 14px 40px}.pol{padding:8px 8px 6px}.cap{font-size:1.15rem}.pol::before{width:48px}}
@media (prefers-reduced-motion:reduce){.pol{transition:none}.porthole{animation:none}.mascot{animation:none}.fish{display:none}.bub{animation:none;bottom:auto}.b1{top:20%}.b2{top:55%}.b3{top:35%}.b4{top:75%}.b5{top:12%}.b6{top:65%}}
</style>
</head>

function shrink(fl,max,q){return new Promise(function(res,rej){
  var url=URL.createObjectURL(fl),im=new Image();
  im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);var d=c.toDataURL('image/jpeg',q);
    if(d.length>800000&&max>600)shrink(fl,600,.6).then(res,rej);else res(d)};
  im.onerror=function(){URL.revokeObjectURL(url);rej()};im.src=url})}

function setFrame(p,src,type){
  var f=p._f;f.innerHTML='';p._src=src;p._type=type;
  if(src){var im=document.createElement('img');im.src=src;im.alt='Photo';f.appendChild(im);if(type==='video'){var pb=document.createElement('span');pb.className='play';pb.textContent='\u25b6';f.appendChild(pb)}f.setAttribute('aria-label',type==='video'?'Play video':'View photo larger')}

function startDrag(p,g,e){

  var r=p.getBoundingClientRect(),ghost=p.cloneNode(true),dx=e.clientX-r.left,dy=e.clientY-r.top,over=null,after=false;

    ghost.style.left=(ev.clientX-dx)+'px';ghost.style.top=(ev.clientY-dy)+'px';
    if(ev.clientY<70)window.scrollBy(0,-14);else if(ev.clientY>window.innerHeight-70)window.scrollBy(0,14);
    var el=document.elementFromPoint(ev.clientX,ev.clientY),t=el&&el.closest?el.closest('.pol'):null;
    clear();over=null;
    if(t&&t!==p&&!t.classList.contains('ghost')){var tr=t.getBoundingClientRect();over=t;after=ev.clientX>tr.left+tr.width/2;t.classList.add(after?'drop-after':'drop-before')}

  }

  function cancel(){finish(false)}
  g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',cancel);
}
function build(it){
  var p=document.createElement('figure');p.className='pol';p._id=it.id;
  var f=document.createElement('button');f.className='frame';f.type='button';p._f=f;
  var c=document.createElement('figcaption');c.className='cap';c.contentEditable=LOCK_CAPTIONS?'false':'true';c.spellcheck=false;if(!LOCK_CAPTIONS)c.dataset.ph='write a memory';p._c=c;
  var x=document.createElement('button');x.className='x';x.type='button';x.textContent='\u00d7';x.setAttribute('aria-label','Delete this photo');
  f.addEventListener('click',function(){

  var t=null;
  c.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){ops.cap(p._id,c.textContent)},600)});
  x.addEventListener('click',function(){

    x.classList.add('warn');x.textContent='Delete?';
    setTimeout(function(){x.classList.remove('warn');x.textContent='\u00d7'},3000)});
  p.append(f,c,x);

function render(){
  var ids=items.map(function(i){return i.id});
  Object.keys(els).forEach(function(id){if(ids.indexOf(id)<0){els[id].remove();delete els[id]}});
  items.forEach(function(it,idx){
    var p=els[it.id];if(!p){p=build(it);els[it.id]=p}
    if(p._src!==(it.src||null)||p._type!==it.type)setFrame(p,it.src||null,it.type);
    if(document.activeElement!==p._c&&p._c.textContent!==(it.cap||''))p._c.textContent=it.cap||'';
    if(wall.children[idx]!==p)wall.insertBefore(p,wall.children[idx]||null);
  });
}

    var c=(e&&e.code)||'';
    if(c==='permission-denied')say('Not allowed: in Firebase go to Firestore > Rules and publish the open rules, then refresh.');
    else if(c==='not-found'||c==='failed-precondition'||c==='unavailable')say('Database not found: in Firebase go to Build > Firestore Database and click Create database (ID must be (default)), then refresh.');
    else say('Firebase error ('+(c||e)+'). Check your config, database ID and Firestore rules.');
  };
  getDoc(store.meta).then(function(s){
    if(!s.exists()){setDoc(store.meta,{title:titleEl.textContent,sub:subEl.textContent});for(var i=0;i<6;i++)ops.add(null,'',Date.now()+i)}
  }).catch(err);
  onSnapshot(query(store.photos,orderBy('order')),{includeMetadataChanges:true},function(s){
    items=s.docs.map(function(d){var v=d.data();return {id:d.id,src:v.src,cap:v.cap,order:v.order,type:v.type,mime:v.mime,n:v.n}});
    render();say(s.metadata.hasPendingWrites?'Saving\u2026':(s.metadata.fromCache?'Offline: will sync when connected':'Saved and synced'));
  },err);
  onSnapshot(store.meta,function(s){
    var v=s.data();if(!v)return;
    var fix={};
    if(v.title==='Our favorite moments'){v.title='Our Gallery';fix.title=v.title}
    if(v.sub==='for you, with love'){v.sub='for my cute baby <3';fix.sub=v.sub}
    if(fix.title||fix.sub)setDoc(store.meta,fix,{merge:true});
    if(document.activeElement!==titleEl&&v.title!=null)titleEl.textContent=v.title;
    if(document.activeElement!==subEl&&v.sub!=null)subEl.textContent=v.sub;
  },err);
}else{
  ops={
    add:function(src,cap,o){items.push({id:'l'+(n++),src:src||null,cap:cap||''});render()},
    src:function(id,src){items.forEach(function(i){if(i.id===id)i.src=src});render()},
    cap:function(id,cap){items.forEach(function(i){if(i.id===id)i.cap=cap})},
    remove:function(id){items=items.filter(function(i){return i.id!==id});render()},
    video:function(id,poster,mime,chunks,blob){var vu=URL.createObjectURL(blob),it=id&&items.filter(function(i){return i.id===id})[0];if(it){it.src=poster;it.type='video';it.vurl=vu}else items.push({id:'l'+(n++),src:poster,type:'video',vurl:vu,cap:''});render()},
    moveTo:function(id,tid,after){var m=items.filter(function(i){return i.id===id})[0],rest=items.filter(function(i){return i.id!==id}),ti=-1;rest.forEach(function(i,k){if(i.id===tid)ti=k});if(ti<0||!m)return;rest.splice(ti+(after?1:0),0,m);items=rest;render()},
    meta:function(){}
  };
  for(var i=0;i<6;i++)ops.add(null,'');
  say(initErr?('Firebase setup error: '+(initErr.message||initErr)):'Firebase is not set up yet, so nothing is saved. Paste your config into the file.');
}

async function playVideo(id){
  var it=items.filter(function(i){return i.id===id})[0];if(!it)return;
  try{
    var u=it.vurl||vcache[id];
    if(!u){say('Loading video\u2026');
      var sn=await getDocs(collection(store.fs,'photos',id,'chunks')),b64=sn.docs.map(function(d){return d.data()}).sort(function(a,b){return a.i-b.i}).map(function(d){return d.d}).join(''),bin=atob(b64),u8=new Uint8Array(bin.length);
      for(var k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);
      u=vcache[id]=URL.createObjectURL(new Blob([u8],{type:it.mime||'video/mp4'}));say('')}
    big.style.display='none';bigv.style.display='block';bigv.src=u;lb.showModal();bigv.play().catch(function(){});
  }catch(e){say('Could not load video ('+((e&&e.code)||e)+')')}
}
function addVideo(file){return new Promise(function(done){
  var MAXS=12,tid=target,dead=false;target=null;
  var url=URL.createObjectURL(file),v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  function fail(m){dead=true;URL.revokeObjectURL(url);say(m);done()}
  v.onerror=function(){fail('This video could not be read. Try another one (MP4 works best).')};
  v.onloadeddata=function(){
    var sc=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)),w=Math.round(v.videoWidth*sc)&~1,h=Math.round(v.videoHeight*sc)&~1,c=document.createElement('canvas'),x=c.getContext('2d');
    c.width=w;c.height=h;var dur=Math.min(MAXS,v.duration||MAXS);
    x.drawImage(v,0,0,w,h);var poster=c.toDataURL('image/jpeg',.7);
    var types=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'],mt='';
    if(window.MediaRecorder)types.forEach(function(t){if(!mt&&MediaRecorder.isTypeSupported(t))mt=t});
    if(!mt||!c.captureStream)return fail('This browser cannot process videos. Try the latest Chrome or Safari.');
    var rec=new MediaRecorder(c.captureStream(24),{mimeType:mt,videoBitsPerSecond:450000}),parts=[],raf;
    rec.ondataavailable=function(e){if(e.data.size)parts.push(e.data)};
    rec.onstop=function(){
      if(dead)return;cancelAnimationFrame(raf);URL.revokeObjectURL(url);
      var blob=new Blob(parts,{type:mt.split(';')[0]}),fr=new FileReader();
      fr.onload=function(){
        var b64=String(fr.result).split(',')[1]||'',chunks=[];
        for(var i=0;i<b64.length;i+=700000)chunks.push(b64.slice(i,i+700000));
        if(!chunks.length||chunks.length>5)return fail('That video is too large to save. Try a shorter clip.');
        var empty=items.find(function(o){return !o.src}),id=tid||(empty&&empty.id)||null;
        Promise.resolve(ops.video(id,poster,blob.type,chunks,blob)).then(function(){say('Video added');done()}).catch(function(e){fail('Could not save video ('+((e&&e.code)||e)+')')});
      };fr.readAsDataURL(blob);
    };
    say('Processing video\u2026 keep this tab open (about '+Math.ceil(dur)+' seconds)');
    rec.start(500);v.currentTime=0;
    v.play().then(function(){
      (function loop(){x.drawImage(v,0,0,w,h);
        if(v.ended||v.currentTime>=dur){v.pause();if(rec.state!=='inactive')rec.stop();return}
        raf=requestAnimationFrame(loop)})();
    }).catch(function(){dead=true;if(rec.state!=='inactive')rec.stop();fail('The browser blocked video processing. Please try again.')});
  };
})}
function addFiles(files){addFiles2(files).catch(function(e){say('Could not save ('+((e&&e.code)||e)+')')})}
async function addFiles2(files){
  say('Adding photos\u2026');
  for(var i=0;i<files.length;i++){
    if(files[i].type.indexOf('video/')===0){await addVideo(files[i]);continue}
    var src;try{src=await shrink(files[i],1000,.78)}catch(e){continue}
    if(src.length>1000000){say('One photo was too large to save. Try a smaller one.');continue}
    if(target){await ops.src(target,src);target=null;continue}
    var empty=items.find(function(o){return !o.src});
    if(empty)await ops.src(empty.id,src);else await ops.add(src,'');
  }
}
document.getElementById('add').addEventListener('click',function(){target=null;file.setAttribute('multiple','');file.click()});
document.getElementById('more').addEventListener('click',function(){Promise.resolve(ops.add(null,'')).catch(function(e){say('Could not add frame ('+((e&&e.code)||e)+')')})});
file.addEventListener('change',function(){var fl=Array.prototype.slice.call(file.files);file.value='';if(fl.length)addFiles(fl);else target=null});
lb.addEventListener('click',function(e){if(e.target!==bigv)lb.close()});lb.addEventListener('close',function(){bigv.pause();bigv.removeAttribute('src');bigv.load()});
titleEl.addEventListener('input',ops.meta);subEl.addEventListener('input',ops.meta);
</script>
